[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["sftool"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.urls]
Documentation = "https://lucidbeaming.com/art/code/sftool"
Source = "https://github.com/lucidbeaming/sftool"
